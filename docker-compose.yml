# Production compose. Host ports are configurable via .env (non-standard defaults so
# they don't clash with other services on the server). db/redis are NOT exposed to the
# host — they're reachable only on the internal docker network.
#
# Local development overrides (source mounts + hot-reload + exposed db/redis) live in
# docker-compose.override.yml, which is gitignored. Copy the .example to enable it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_resume}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    command: ["api"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - storage:/data/storage
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  pgdata:
  storage:
