[project]
name = "ai-resume-backend"
version = "0.1.0"
description = "Multi-tenant AI resume-filtering platform — API + worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "cryptography>=44.0",
    "anthropic>=0.42",
    "openai>=1.59",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pillow>=11.0",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = ["app"]
